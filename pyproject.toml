[project]
name = "coding-agent"
version = "0.1.0"
description = "Local LLM agent with LSP, DAP, profiling, browser verification, and MCP integration"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "mcp",
    "psutil",
    # verify mode drives a real browser; the Playwright sync API is the whole
    # runtime behind runtime/browser.py and every tools/browser_*.py tool.
    "playwright>=1.49",
]

[dependency-groups]
# PyYAML is not imported by the agent itself — only by the eval that parses the
# report_issue log back. Declared here so `uv run` always has it: without it the
# contract check silently skipped every one of its assertions and still reported
# a pass.
dev = [
    "pyyaml",
]

[tool.uv]
package = false
